<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wikipedia Time Machine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">
      <span class="orbit" aria-hidden="true"><i></i></span>
      <span><h1>Wikipedia Time Machine</h1><small>history kept by MariaDB, one clause</small></span>
    </a>
    <nav>
      <a href="{{ url_for('index', title=title) }}" class="{{ 'active' if request.endpoint == 'index' }}">Read</a>
      <a href="{{ url_for('compare', title=title) }}" class="{{ 'active' if request.endpoint == 'compare' }}">Compare</a>
    </nav>
    <div id="controls">{% block form %}{% endblock %}</div>
  </header>
  {% block main %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
